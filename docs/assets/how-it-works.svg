<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">How agent-config works</title>
  <desc id="desc">Project instructions and a matching skill guide the coding agent. Before a tool runs, the guard either allows it or blocks it with a safer route.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .label { font: 700 20px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 500 16px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .small { font: 650 15px ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1120" height="430" rx="20" fill="#f8fafc"/>
  <text x="40" y="50" class="heading">Guidance before action. A check before execution.</text>

  <g transform="translate(40 94)">
    <rect class="box" width="230" height="90" rx="12"/>
    <text x="20" y="36" class="label">Project instructions</text>
    <text x="20" y="65" class="body">Rules for this codebase</text>
  </g>

  <g transform="translate(40 212)">
    <rect class="box" width="230" height="90" rx="12"/>
    <text x="20" y="36" class="label">Matching skill</text>
    <text x="20" y="65" class="body">A focused work method</text>
  </g>

  <path class="line" d="M270 139h74v81h50"/>
  <path class="line" d="M270 257h74v-37h50"/>

  <g transform="translate(394 159)">
    <rect width="210" height="122" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="105" y="48" text-anchor="middle" class="label">Coding agent</text>
    <text x="105" y="78" text-anchor="middle" class="body">Chooses a tool call</text>
  </g>

  <path class="line" d="M604 220h92"/>

  <g transform="translate(696 159)">
    <rect width="172" height="122" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="86" y="48" text-anchor="middle" class="label">Guard</text>
    <text x="86" y="78" text-anchor="middle" class="body">Checks the action</text>
  </g>

  <path class="line" d="M868 202h74"/>
  <path class="line" d="M868 245h36v86h38"/>

  <g transform="translate(942 159)">
    <rect width="138" height="86" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="69" y="35" text-anchor="middle" class="label">Run</text>
    <text x="69" y="61" text-anchor="middle" class="small">Safe action</text>
  </g>

  <g transform="translate(942 288)">
    <rect width="138" height="86" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="69" y="35" text-anchor="middle" class="label">Block</text>
    <text x="69" y="61" text-anchor="middle" class="small">Safer route</text>
  </g>

  <text x="889" y="187" class="small" fill="#166534">allow</text>
  <text x="879" y="317" class="small" fill="#991b1b">refuse</text>
</svg>
