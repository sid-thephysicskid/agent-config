<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Lineage of the sixteen skills</title>
  <desc id="desc">No current skill is a near-verbatim copy. Five are rewritten direct adaptations of Matt Pocock skills, seven are independently written with conceptual influence, and four were authored for this repository.</desc>
  <defs>
    <style>
      .title { font: 750 30px ui-sans-serif, system-ui, sans-serif; fill: #102f43; }
      .count { font: 800 58px ui-sans-serif, system-ui, sans-serif; fill: #102f43; }
      .head { font: 750 21px ui-sans-serif, system-ui, sans-serif; fill: #102f43; }
      .body { font: 500 16px ui-sans-serif, system-ui, sans-serif; fill: #38566a; }
      .names { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #294b60; }
    </style>
  </defs>

  <rect width="1120" height="500" rx="26" fill="#f4ecd9"/>
  <text x="44" y="54" class="title">Sixteen skills, three kinds of lineage</text>
  <g transform="translate(728 24)">
    <rect width="348" height="72" rx="36" fill="#16384d"/>
    <text x="174" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fffaf0">Near-verbatim copies today: 0</text>
  </g>

  <g transform="translate(44 126)">
    <rect width="320" height="320" rx="18" fill="#f8dfaa" stroke="#a26b16" stroke-width="2.5"/>
    <text x="24" y="72" class="count">5</text>
    <text x="24" y="109" class="head">Direct adaptations</text>
    <text x="24" y="140" class="body">Their first versions were close to</text>
    <text x="24" y="163" class="body">Matt's files. Today's versions were</text>
    <text x="24" y="186" class="body">rewritten for this system.</text>
    <text x="24" y="232" class="names">architect · diagnose</text>
    <text x="24" y="260" class="names">review · tdd · unstick</text>
  </g>

  <g transform="translate(400 126)">
    <rect width="320" height="320" rx="18" fill="#e4eef0" stroke="#6f8895" stroke-width="2.5"/>
    <text x="24" y="72" class="count">7</text>
    <text x="24" y="109" class="head">Conceptual influence</text>
    <text x="24" y="140" class="body">Matt's category or workflow shaped the</text>
    <text x="24" y="163" class="body">idea. The instructions and constraints</text>
    <text x="24" y="186" class="body">were written for this repository.</text>
    <text x="24" y="224" class="names">navigate · prototype · to-spec</text>
    <text x="24" y="252" class="names">domain-modeling · research</text>
    <text x="24" y="280" class="names">wizard · handoff</text>
  </g>

  <g transform="translate(756 126)">
    <rect width="320" height="320" rx="18" fill="#fffaf0" stroke="#16384d" stroke-width="2.5"/>
    <text x="24" y="72" class="count">4</text>
    <text x="24" y="109" class="head">Authored here</text>
    <text x="24" y="140" class="body">Designed around problems this config</text>
    <text x="24" y="163" class="body">needed to solve, without a Matt skill</text>
    <text x="24" y="186" class="body">as their source.</text>
    <text x="24" y="232" class="names">bootstrap · breakdown</text>
    <text x="24" y="260" class="names">setup · ship</text>
  </g>
</svg>
