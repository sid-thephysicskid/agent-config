name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  # The whole login. npm exchanges this short-lived GitHub token for a
  # publish grant against the trusted publisher configured on the package.
  # Lose this line and the failure reads "404 Not Found", which sounds like
  # a missing package and means a rejected login.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          # NO registry-url, deliberately. It reads like the setting that
          # points npm at the registry. What it actually does is make
          # setup-node write an .npmrc holding a placeholder token, which
          # npm then prefers over the OIDC exchange. That is a 404.
          package-manager-cache: false
      - name: Require v<package-version> release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: ./scripts/gates --full
      # NO token, deliberately. This publishes as a trusted publisher: npm
      # verifies the OIDC claim naming this repository and this workflow
      # file, so there is nothing to store and nothing to expire.
      #
      # Two ways this was tried and failed, so neither gets tried again:
      # a granular token EXPIRED and the registry answered 404; a replacement
      # token hit EOTP, because the account is set to auth-and-writes and a
      # runner cannot type a one-time password. Trusted publishing is exempt
      # from 2FA precisely because the identity is the workflow, not a human.
      #
      # Requires npm >= 11.5.1, which node 24 already ships.
      - run: npm publish
