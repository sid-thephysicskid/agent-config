name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          # NO registry-url. It looks harmless and it is the thing that breaks
          # trusted publishing: setup-node writes an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}` and exports that variable with the
          # placeholder XXXXX-XXXXX-XXXXX-XXXXX. npm then authenticates with the
          # placeholder rather than falling back to OIDC, and the registry
          # answers 404, which reads as "no such package" and means "your login
          # is bad". With no .npmrc there is no token to prefer, and the OIDC
          # exchange happens.
          package-manager-cache: false
      # npm 11.5.1 is the first release that can exchange an Actions OIDC token
      # for a registry credential. Node 24 ships a new enough npm today; pinning
      # the floor means a future runner image cannot silently take it away.
      - run: npm install -g npm@latest
      - name: Require v<package-version> release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: ./scripts/gates --full
      # No token. npm authenticates this job by OIDC, against the trusted
      # publisher configured on the package, which is what `id-token: write`
      # above is for. The token this used to carry expired and took a release
      # with it, printing a 404 that actually meant "your login is bad". A
      # trusted publisher cannot expire, and npm is restricting the old
      # bypass-2FA tokens anyway.
      - run: npm publish
