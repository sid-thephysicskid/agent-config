name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          # registry-url makes setup-node write the .npmrc that consumes
          # NODE_AUTH_TOKEN below. It is also exactly what prevents OIDC from
          # working, so it belongs with the token and goes away with it.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require v<package-version> release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: ./scripts/gates --full
      # A granular access token with 2FA bypass, which is what the package's
      # own publishing-access setting allows and what shipped every release
      # before this one. It EXPIRES, and when it did the registry answered
      # 404, which reads as "no such package" and means "your login is bad".
      # If a release ever fails that way again, the token is the first thing
      # to check, not the package name.
      #
      # The better answer is a trusted publisher, which cannot expire: set one
      # up at npmjs.com under the package's Settings, then delete the token,
      # the registry-url above, and this env block.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
