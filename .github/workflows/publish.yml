name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require v<package-version> release tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: ./scripts/gates --full
      # No token. npm authenticates this job by OIDC, against the trusted
      # publisher configured on the package, which is what `id-token: write`
      # above is for. The token this used to carry expired and took a release
      # with it, printing a 404 that actually meant "your login is bad". A
      # trusted publisher cannot expire, and npm is restricting the old
      # bypass-2FA tokens anyway.
      - run: npm publish
