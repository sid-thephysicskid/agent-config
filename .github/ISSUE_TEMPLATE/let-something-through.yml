name: The guard let something through
description: A command docs/guard-coverage.md says is refused was allowed.
title: "allowed: <command>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [`tests/redteam-candidates.txt`](../../blob/main/tests/redteam-candidates.txt) first; listed gaps are deliberate. For a working bypass, use private vulnerability reporting instead.
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Verbatim, including quoting. No need to run it.
      render: shell
    validations:
      required: true
  - type: input
    id: cwd
    attributes:
      label: Working directory and branch
      placeholder: ~/code/myapp on main
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "npx @sid-thephysicskid/agent-config@latest --version, macOS 15"
    validations:
      required: true
