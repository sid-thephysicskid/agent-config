name: The guard refused ordinary work
description: A safe command was blocked. That's a bug.
title: "refused: <command>"
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Verbatim, including quoting.
      render: shell
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Block message
      render: text
    validations:
      required: true
  - type: input
    id: cwd
    attributes:
      label: Working directory and branch
      placeholder: ~/code/myapp on feature/x
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "npx @sid-thephysicskid/agent-config@latest --version, macOS 15"
    validations:
      required: true
